[package]
name = "beyt"
version = "0.5.0"
description = "A dual-subtitle video player for language learning"
license = "GPL-3.0-or-later"
edition = "2024"
default-run = "beyt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libmpv2 = "6"
# Must match the GTK version Tauri's Linux backend uses.
gtk = "0.18"
# Same webkit2gtk as wry, for recovering when the page process dies.
webkit2gtk = "2.0"
libc = "0.2"
libloading = "0.8"
chardetng = "1"
encoding_rs = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
# Asks logind to set the laptop backlight (already linked by Tauri's deps).
dbus = "0.9"
# Only talks to AnkiConnect on localhost, so no TLS.
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[features]
# Release builds embed the built frontend; `cargo tauri dev` turns this off
# and uses the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Smaller release binary: whole-program optimisation and one codegen unit
# let the linker drop more unused code from Tauri, GTK and SQLite.
[profile.release]
lto = true
codegen-units = 1
# Nix only strips debug info; this also drops the symbol table.
strip = true
