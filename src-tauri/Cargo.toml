[package]
name = "beyt"
version = "0.1.0"
description = "A dual-subtitle video player for language learning"
license = "GPL-3.0-or-later"
edition = "2024"
default-run = "beyt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libmpv2 = "6"
# Must match the GTK version Tauri's Linux backend uses.
gtk = "0.18"
libloading = "0.8"
chardetng = "1"
encoding_rs = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
# Only talks to AnkiConnect on localhost, so no TLS.
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
